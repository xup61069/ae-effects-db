<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="搜尋 After Effects 外掛、腳本、內建效果與效果配方；支援繁中、英文、日文與 AI 可讀索引。">
<link rel="alternate" type="text/plain" href="llms.txt" title="AI-readable project guide">
<title>AE 特效資料庫 · 搜尋</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#171922; --panel2:#1e2130; --text:#e8eaf0; --muted:#9aa0b4;
    --accent:#6ea8fe; --accent2:#f0a; --border:#2a2e3f; --chip:#232735;
    --plugin-bg:#101f2b; --plugin-border:#2b5d82; --plugin-label:#83c8ff;
    --script-bg:#24182d; --script-border:#704789; --script-label:#dda4ff;
    --builtin-bg:#15251d; --builtin-border:#397356; --builtin-label:#82dca9;
    --recipe-bg:#292115; --recipe-border:#80652e; --recipe-label:#f0c66e;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7fb; --panel:#fff; --panel2:#f0f2f8; --text:#1a1d29; --muted:#666e85;
           --accent:#2563eb; --accent2:#c026a8; --border:#e2e5ee; --chip:#eef1f8;
           --plugin-bg:#edf7ff; --plugin-border:#9bc9ee; --plugin-label:#17649d;
           --script-bg:#f8effd; --script-border:#d1abe5; --script-label:#7d3d9d;
           --builtin-bg:#eef9f2; --builtin-border:#a7d7b7; --builtin-label:#267349;
           --recipe-bg:#fff8e8; --recipe-border:#dfc682; --recipe-label:#8a6815;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 18px}
  h1{margin:0 0 2px;font-size:18px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:12.5px}
  .headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .langswitch{display:flex;gap:4px;padding:3px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
  .langswitch button{border:0;border-radius:7px;padding:4px 8px;background:transparent;color:var(--muted);font:inherit;font-size:11px;cursor:pointer}
  .langswitch button:hover{color:var(--text)}.langswitch button.on{background:var(--accent);color:#fff}
  .language-note{margin-top:7px;padding:7px 9px;border-left:3px solid var(--accent);border-radius:5px;background:var(--panel);color:var(--muted);font-size:11.5px}
  .language-note a{color:var(--accent);text-underline-offset:2px}.language-note .verified{white-space:nowrap}
  .language-note[hidden]{display:none}.original-label{display:block;margin-top:4px;color:var(--muted);font-size:10.5px}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px}
  .searchbox{position:relative;margin-top:12px}
  #q{width:100%;padding:13px 44px 13px 15px;font-size:16px;border-radius:12px;border:1px solid var(--border);
     background:var(--panel);color:var(--text);outline:none}
  #q:focus{border-color:var(--accent)}
  #clearQ{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;
    border-radius:9px;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
  #clearQ:hover{color:var(--text);background:var(--panel2)}
  #clearQ[hidden]{display:none}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .filters select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:13px}
  .filters button{background:var(--panel);color:var(--accent);border:1px solid var(--border);border-radius:9px;
    padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  .filters button:hover{border-color:var(--accent)}
  .aimsg{margin-top:8px;font-size:12.5px;color:var(--accent);min-height:1em}
  .aimsg:empty{display:none;margin-top:0;min-height:0}
  .aimsg a{color:var(--accent)}
  .dd{position:relative;display:inline-block}
  .aibtn{margin-left:auto}
  .catpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:30;
    width:max-content;max-width:min(560px,88vw);
    padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--panel);
    box-shadow:0 10px 30px rgba(0,0,0,.28);
    display:flex;flex-wrap:wrap;gap:6px;max-height:min(300px,50vh);overflow-y:auto}
  .catpanel[hidden]{display:none}   /* 必要：class 的 display:flex 會蓋過 [hidden] 的 display:none */
  .actbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .actbar:empty{display:none;margin-top:0}
  .actbar .a{font:inherit;font-size:12px;background:var(--accent);color:#fff;border:0;border-radius:20px;padding:3px 9px;
    cursor:pointer;user-select:none}
  .actbar .a .x{margin-left:6px;opacity:.85}
  .actbar .allclr{font:inherit;font-size:12px;color:var(--muted);background:transparent;border:1px dashed var(--border);
    border-radius:20px;padding:3px 9px;cursor:pointer}
  .catpanel .c{font-size:12.5px;border:1px solid var(--border);background:var(--panel2);color:var(--text);
    border-radius:20px;padding:4px 11px;cursor:pointer;user-select:none;white-space:nowrap}
  .catpanel .c:hover{border-color:var(--accent)}
  .catpanel .c.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .catpanel .c .n{color:var(--muted);font-size:11px;margin-left:5px}
  .catpanel .c.on .n{color:rgba(255,255,255,.8)}
  .catpanel .clr{color:var(--accent);border-style:dashed}
  .filters button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .favfilter{white-space:nowrap}
  .favfilter .n{margin-left:4px;font-size:11px;opacity:.8}
  button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  .hint b{color:var(--accent);cursor:pointer;font-weight:600}
  #count{color:var(--muted);font-size:12.5px;margin:14px 0 4px}
  .summary{display:inline-flex;flex-wrap:wrap;gap:5px;margin-left:7px}
  .summary i{font-style:normal;border:1px solid var(--border);border-radius:20px;padding:1px 7px}
  .card{background:var(--panel);border:1px solid var(--border);border-left-width:4px;border-radius:12px;padding:13px 15px;margin:9px 0;
    content-visibility:auto;contain-intrinsic-size:0 220px}
  .card.kind-plugin{background:var(--plugin-bg);border-color:var(--plugin-border)}
  .card.kind-script{background:var(--script-bg);border-color:var(--script-border)}
  .card.kind-builtin{background:var(--builtin-bg);border-color:var(--builtin-border)}
  .card.kind-recipe{background:var(--recipe-bg);border-color:var(--recipe-border)}
  .card .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .name{font-size:16px;font-weight:650}
  .kindbadge,.catbadge,.officialbadge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid transparent}
  .kindbadge{font-weight:700}
  .kindbadge.kind-plugin{color:var(--plugin-label);border-color:var(--plugin-border);background:color-mix(in srgb,var(--plugin-bg) 65%,transparent)}
  .kindbadge.kind-script{color:var(--script-label);border-color:var(--script-border);background:color-mix(in srgb,var(--script-bg) 65%,transparent)}
  .kindbadge.kind-builtin{color:var(--builtin-label);border-color:var(--builtin-border);background:color-mix(in srgb,var(--builtin-bg) 65%,transparent)}
  .kindbadge.kind-recipe{color:var(--recipe-label);border-color:var(--recipe-border);background:color-mix(in srgb,var(--recipe-bg) 65%,transparent)}
  .catbadge{color:var(--muted);background:var(--chip);border-color:var(--border)}
  .officialbadge{color:var(--builtin-label);background:var(--builtin-bg);border-color:var(--builtin-border);text-decoration:none}
  .kindlegend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;color:var(--muted);font-size:11.5px}
  .kindlegend span{display:inline-flex;align-items:center;gap:5px}
  .kindlegend i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .kindlegend .plugin{background:var(--plugin-label)} .kindlegend .script{background:var(--script-label)}
  .kindlegend .builtin{background:var(--builtin-label)} .kindlegend .recipe{background:var(--recipe-label)}
  .warn{font-size:11px;color:#e0a020;background:rgba(224,160,32,.13);padding:2px 8px;border-radius:20px}
  a.namelink{color:var(--text);text-decoration:none}
  a.namelink:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .ext{font-size:11px;color:var(--muted);margin-left:5px;vertical-align:2px}
  a.namelink:hover .ext{color:var(--accent)}
  .src{font-size:11px;color:var(--muted);margin-left:auto}
  .favbtn{align-self:center;width:28px;height:28px;margin:-4px -4px -4px 0;padding:0;border:1px solid transparent;
    border-radius:8px;background:transparent;color:var(--muted);font:18px/1 inherit;cursor:pointer}
  .favbtn:hover{color:#f3c64e;background:var(--chip);border-color:var(--border)}
  .favbtn.on{color:#f3c64e}
  .cardactions{display:flex;gap:5px;margin-left:auto}
  .cardactions button,.popscore,.datebadge{font:inherit;font-size:11px;border:1px solid var(--border);border-radius:8px;
    background:var(--chip);color:var(--muted);padding:3px 7px}
  .cardactions button{cursor:pointer}.cardactions button:hover,.cardactions button.on{color:var(--accent);border-color:var(--accent)}
  .popscore{cursor:help}.datebadge{color:var(--builtin-label)}
  .desc{color:var(--text);margin-top:6px;font-size:14px}
  .stack{margin-top:8px;padding-left:2px}
  .stack li{font-size:13px;color:var(--muted);margin:2px 0}
  .variants{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .variants span{font-size:11.5px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:2px 7px;color:var(--muted)}
  .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .tags button{font:inherit;font-size:11px;color:var(--muted);background:var(--chip);border:0;border-radius:6px;padding:1px 7px;cursor:pointer}
  .tags button:hover{color:var(--accent)}
  mark{background:transparent;color:var(--accent2);font-weight:700}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:26px 0 40px}
  footer a{color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .more{display:block;margin:18px auto 4px;padding:9px 18px;border:1px solid var(--border);border-radius:10px;
    background:var(--panel);color:var(--accent);font:inherit;cursor:pointer}
  .more:hover{border-color:var(--accent)}
  dialog.modal{width:min(760px,calc(100vw - 24px));max-height:min(86vh,820px);padding:0;border:1px solid var(--border);
    border-radius:16px;background:var(--panel);color:var(--text);box-shadow:0 24px 80px rgba(0,0,0,.55)}
  dialog.modal::backdrop{background:rgba(4,6,10,.72);backdrop-filter:blur(3px)}
  .modalhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-bottom:1px solid var(--border);background:var(--panel)}
  .modalhead h2{font-size:17px;margin:0}.modalhead .close{margin-left:auto;width:34px;height:34px;border:0;border-radius:9px;
    background:var(--chip);color:var(--text);font-size:18px;cursor:pointer}
  .modalbody{padding:16px;overflow:auto}.modalbody h3{font-size:13px;margin:18px 0 6px;color:var(--muted)}
  .detailmeta{display:flex;gap:6px;flex-wrap:wrap}.detailtags{display:flex;gap:5px;flex-wrap:wrap}
  .detailtags span{font-size:12px;border-radius:7px;padding:3px 8px;background:var(--chip);color:var(--muted)}
  .detailactions,.favtools{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.detailactions a,.detailactions button,.favtools button{
    font:inherit;font-size:13px;text-decoration:none;border:1px solid var(--border);border-radius:9px;padding:7px 10px;
    background:var(--panel2);color:var(--accent);cursor:pointer}
  .popbreak{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.popbreak span{padding:8px 5px;text-align:center;
    border:1px solid var(--border);border-radius:9px;background:var(--chip);font-size:11px;color:var(--muted)}
  .popbreak b{display:block;color:var(--text);font-size:15px}
  .comparetray{position:fixed;z-index:40;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;
    max-width:calc(100vw - 24px);padding:9px 11px;border:1px solid var(--accent);border-radius:13px;background:var(--panel);
    box-shadow:0 12px 35px rgba(0,0,0,.45)}
  .comparetray[hidden]{display:none}.comparetray button{font:inherit;font-size:12px;border:1px solid var(--border);border-radius:8px;
    background:var(--chip);color:var(--accent);padding:6px 9px;cursor:pointer}.comparetray .primary{background:var(--accent);color:#fff}
  .comparetable{width:100%;border-collapse:collapse;font-size:12.5px}.comparetable th,.comparetable td{padding:8px;
    border-bottom:1px solid var(--border);vertical-align:top;text-align:left}.comparetable th:first-child{color:var(--muted);width:92px}
  .mobile-searchbar{display:none}.backtop{position:fixed;right:16px;bottom:16px;z-index:35;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--border);background:var(--panel);color:var(--accent);font-size:18px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .backtop[hidden]{display:none}
  @media (max-width:640px){
    header{position:static;padding:12px 0}
    header .searchbox{display:none}
    .mobile-searchbar{display:flex;position:sticky;top:0;z-index:45;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--border)}
    .mobile-searchbar input{width:100%;padding:11px 40px 11px 13px;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:var(--text);font-size:16px}
    .mobile-searchbar button{margin-left:-38px;width:36px;border:0;background:transparent;color:var(--muted);font-size:18px}
    .wrap{padding:0 12px}
    .headrow{align-items:flex-start}.langswitch button{padding:4px 6px}
    .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
    .filters .dd,.filters .dd>button,.filters select,.filters .favfilter{width:100%}
    .aibtn{grid-column:1/-1;margin-left:0}
    .catpanel{max-width:calc(100vw - 24px)}
    .kindlegend{gap:5px 9px}
    .card{padding:12px;margin:8px 0}
    .src{width:100%;margin-left:0}
    .summary{display:flex;margin:5px 0 0}
    .cardactions{width:100%;margin-left:0}.popbreak{grid-template-columns:repeat(2,1fr)}
    .comparetable{display:block;overflow-x:auto;white-space:normal}.backtop{bottom:70px}
  }
</style>
</head>
<body>
<div class="mobile-searchbar"><input id="mq" placeholder="搜尋 AE 特效…" autocomplete="off" aria-label="手機搜尋 AE 特效"><button id="clearMq" type="button" aria-label="清除搜尋">×</button></div>
<header>
  <div class="wrap">
    <div class="headrow"><h1 id="siteTitle">🎬 AE 特效資料庫</h1><nav id="languageSwitch" class="langswitch" aria-label="Language"><button type="button" data-lang="zh">繁中</button><button type="button" data-lang="en">English</button><button type="button" data-lang="ja">日本語</button></nav></div>
    <div id="siteSubtitle" class="sub">描述想要的畫面，從 AE 外掛、腳本、內建效果與效果配方中找工具</div>
    <div class="searchbox">
      <input id="q" placeholder="輸入描述… 例：發光、故障、老電影、甩鏡轉場、粒子、去背、慢動作" autofocus autocomplete="off" aria-label="搜尋 AE 特效">
      <button id="clearQ" type="button" title="清除搜尋" aria-label="清除搜尋" hidden>×</button>
    </div>
    <div class="filters">
      <span class="dd">
        <button id="catBtn" type="button" title="可複選分類" aria-expanded="false">分類 ▾</button>
        <div id="catPanel" class="catpanel" hidden></div>
      </span>
      <span class="dd">
        <button id="srcBtn" type="button" title="可複選來源" aria-expanded="false">來源 ▾</button>
        <div id="srcPanel" class="catpanel" hidden></div>
      </span>
      <span class="dd">
        <button id="kindBtn" type="button" title="可複選工具型態" aria-expanded="false">型態 ▾</button>
        <div id="kindPanel" class="catpanel" hidden></div>
      </span>
      <select id="sort" title="排序方式">
        <option value="popular" selected>排序：精選熱門</option>
        <option value="relevance">排序：搜尋相關度</option>
        <option value="name">排序：名稱 A–Z</option>
        <option value="category">排序：分類</option>
        <option value="source">排序：來源</option>
        <option value="latest">排序：最新（官方日期）</option>
      </select>
      <button id="favBtn" class="favfilter" type="button" aria-pressed="false" title="收藏只儲存在這台裝置的瀏覽器">☆ 只看收藏<span class="n">0</span></button>
      <button id="favManageBtn" type="button" title="匯出、匯入或清除收藏">收藏管理</button>
      <button id="aiBtn" class="aibtn" type="button" title="複製一段提示詞，貼進 ChatGPT/Claude 就能用「貼圖」找特效">🤖 用 AI 找 / 貼圖找</button>
    </div>
    <div id="activeFilters" class="actbar"></div>
    <div id="aiMsg" class="aimsg"></div>
    <div id="kindLegend" class="kindlegend" aria-label="工具型態顏色圖例">
      <span><i class="plugin"></i>外掛／效果</span><span><i class="script"></i>腳本／面板</span>
      <span><i class="builtin"></i>AE 內建</span><span><i class="recipe"></i>效果配方</span>
    </div>
    <div id="hintBox" class="hint">試試：
      <b data-q="霓虹">霓虹</b> ·
      <b data-q="老電影">老電影</b> ·
      <b data-q="故障">故障</b> ·
      <b data-q="甩鏡">甩鏡</b> ·
      <b data-q="去背">去背</b> ·
      <b data-q="慢動作">慢動作</b> ·
      <b data-q="魔法">魔法</b> ·
      <b data-q="調色">調色</b>
    </div>
  </div>
</header>
<div class="wrap">
  <div id="count" aria-live="polite"></div>
  <div id="results"></div>
</div>
<footer>
  <div id="footerSummary">共 <span id="total">…</span> 筆 · 點名稱開官方頁 · 搭配 Codex / Claude Code 的 <code>/find-effect</code> 可「貼圖」搜尋</div>
  <div id="footerLinks" style="margin-top:10px">
    找不到某個外掛？歡迎補充 →
    <a href="https://github.com/xup61069/ae-effects-db/issues/new?template=add-effect.yml" target="_blank" rel="noopener">回報缺少的特效</a> ·
    <a href="https://github.com/xup61069/ae-effects-db/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">如何貢獻</a> ·
    <a href="https://github.com/xup61069/ae-effects-db" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>

<div id="compareTray" class="comparetray" hidden><span id="compareTrayText"></span><button id="compareClear" type="button">清除</button><button id="compareOpen" class="primary" type="button">比較</button></div>
<button id="backTop" class="backtop" type="button" title="返回頂端" aria-label="返回頂端" hidden>↑</button>

<dialog id="detailDialog" class="modal"><div class="modalhead"><h2 id="detailTitle">工具詳情</h2><button class="close" type="button" data-close="detailDialog" aria-label="關閉">×</button></div><div id="detailBody" class="modalbody"></div></dialog>
<dialog id="compareDialog" class="modal"><div class="modalhead"><h2 id="compareDialogTitle">工具比較</h2><button class="close" type="button" data-close="compareDialog" aria-label="關閉">×</button></div><div id="compareBody" class="modalbody"></div></dialog>
<dialog id="favoritesDialog" class="modal"><div class="modalhead"><h2 id="favoritesDialogTitle">收藏管理</h2><button class="close" type="button" data-close="favoritesDialog" aria-label="關閉">×</button></div><div class="modalbody"><p id="favoritesHelp">收藏只存在目前瀏覽器；可匯出 JSON 備份，再到另一台裝置匯入。</p><div class="favtools"><button id="favExport" type="button">匯出收藏</button><button id="favImport" type="button">匯入收藏</button><button id="favClearAll" type="button">清除全部</button><input id="favImportFile" type="file" accept="application/json,.json" hidden></div><div id="favManageMsg" class="aimsg" aria-live="polite"></div></div></dialog>

<script>
const FILES = ["red-giant","universe","sapphire","continuum","builtin-ae","aescripts","third-party","booth","gumroad","installed","recipes"];
const ASSET_VERSION = "2026-08-16-3";

function officialCategory(d){
  if(d.kind!=="builtin"||!d.url)return null;
  let url;try{url=new URL(d.url);}catch(_){return null;}
  if(url.hostname!=="helpx.adobe.com")return null;
  const language=LANG==="ja"?"ja":"en";
  const categoryId=LOCALIZATION_CONFIG.official_effect_categories?.[d.name];
  const category=categoryId?LOCALIZATION_CONFIG.official_categories?.[categoryId]:null;
  const pathname=url.pathname.toLowerCase();
  const rule=category?null:(LOCALIZATION_CONFIG.official_category_rules||[]).find(item=>(item.patterns||[]).some(pattern=>pathname.includes(pattern.toLowerCase())));
  if(!category&&!rule)return null;
  const source=LOCALIZATION_CONFIG.sources?.[`adobe_effect_categories_${language}`]||LOCALIZATION_CONFIG.sources?.adobe_effect_categories_en||d.url;
  return {label:category?.[language]||category?.en||rule.labels?.[language]||rule.labels?.en||rule.id,source};
}

function deriveSrc(fileSrc,url){
  let host="";
  try{host=new URL(url).hostname.toLowerCase();}catch(_){}
  if(host==="booth.pm"||host.endsWith(".booth.pm"))return "booth";
  if(host==="gumroad.com"||host.endsWith(".gumroad.com"))return "gumroad";
  return fileSrc;
}
async function loadLegacyData(){
  const all=await Promise.all(FILES.map(async f=>{
    try{
      const response = await fetch("data/"+f+".jsonl");
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      const t = await response.text();
      return t.split("\n").filter(l=>l.trim()).map((l,i)=>{
        try{const o=JSON.parse(l);o._src=deriveSrc(f,o.url||"");o._rank=i;return o;}catch(e){return null;}
      }).filter(Boolean);
    }catch(e){LOAD_ERRORS.push(`${f}: ${e.message}`);return [];}
  }));
  return all.flat();
}

async function boot(){
  applyLanguage();
  LOAD_ERRORS = [];
  const [indexResult,popularityResult,localizationResult,searchAliasesResult]=await Promise.allSettled([
    fetch(`dist/web-index.json?v=${ASSET_VERSION}`).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}),
    fetch(`curation/popularity.json?v=${ASSET_VERSION}`).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}),
    fetch(`curation/localization.json?v=${ASSET_VERSION}`).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}),
    fetch(`curation/search-aliases.ja.json?v=${ASSET_VERSION}`).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();})
  ]);
  if(popularityResult.status==="fulfilled") POPULARITY_CONFIG=popularityResult.value;
  else LOAD_ERRORS.push(t("loadPopularityError",{error:popularityResult.reason.message}));
  if(localizationResult.status==="fulfilled") LOCALIZATION_CONFIG=localizationResult.value;
  else LOAD_ERRORS.push(t("loadLocalizationError",{error:localizationResult.reason.message}));
  if(searchAliasesResult.status==="fulfilled"&&searchAliasesResult.value?.aliases){
    Object.entries(searchAliasesResult.value.aliases).forEach(([key,values])=>{SEARCH_ALIASES[normalizeText(key)]=values;});
  }else LOAD_ERRORS.push(t("loadSearchAliasesError",{error:searchAliasesResult.reason?.message||"invalid format"}));
  POPULAR_INDEX=new Map((POPULARITY_CONFIG.featured||[]).map((key,index)=>[key,index]));
  if(indexResult.status==="fulfilled"&&Array.isArray(indexResult.value)) DATA=indexResult.value;
  else{
    LOAD_ERRORS.push(t("loadIndexError",{error:indexResult.reason?.message||"invalid format"}));
    DATA=await loadLegacyData();
  }
  DATA.forEach(d=>{
    d._search=normalizeText(d._search||hayRaw(d));
    d._nameSearch=normalizeText(d.name);
    d._tagSearch=normalizeText((d.tags||[]).join(" "));
    d._date=d.updated||d.released||"";
    DATA_BY_KEY.set(itemKey(d),d);
  });
  const availableKeys=new Set(DATA.map(itemKey));
  let favoritesChanged=false;
  for(const key of FAVORITES){if(!availableKeys.has(key)){FAVORITES.delete(key);favoritesChanged=true;}}
  if(favoritesChanged)saveFavorites();
  applyLanguage();
  // build filters
  catFilter.build(); srcFilter.build(); kindFilter.build();
  restoreState();
  if(LOAD_ERRORS.length){
    document.getElementById("aiMsg").textContent=t("loadFilesError",{count:LOAD_ERRORS.length,errors:LOAD_ERRORS.join("、")});
  }
  render();
  const requestedItem=new URL(location.href).searchParams.get("item");
  if(requestedItem&&DATA_BY_KEY.has(requestedItem)) openDetail(requestedItem,false);
}

// ── 多選篩選器（分類 / 來源共用）────────────────────────────
function makeFilter({btnId, panelId, labelKey, keyOf, labelOf, sortByCount}){
  const sel = new Set();
  const btn = () => document.getElementById(btnId);
  const panel = () => document.getElementById(panelId);

  function build(){
    const counts = {};
    DATA.forEach(d=>{ const k=keyOf(d); if(k) counts[k]=(counts[k]||0)+1; });
    let keys = Object.keys(counts);
    keys.sort(sortByCount ? (a,b)=>counts[b]-counts[a]||a.localeCompare(b)
                          : (a,b)=>FILES.indexOf(a)-FILES.indexOf(b));   // 來源維持原本的排列順序
    panel().innerHTML =
      `<button type="button" class="c clr" data-clear="1">✕ ${esc(t("clear"))}</button>` +
      keys.map(k=>`<button type="button" class="c" data-k="${esc(k)}" aria-pressed="false">${esc(labelOf(k))}<span class="n">${counts[k]}</span></button>`).join("");
    panel().addEventListener("click", e=>{
      const el = e.target.closest(".c");
      if(!el) return;
      if(el.dataset.clear) sel.clear();
      else{ const k=el.dataset.k; sel.has(k) ? sel.delete(k) : sel.add(k); }
      sync(); renderActive(); render();
    });
    btn().addEventListener("click", e=>{
      e.stopPropagation();
      const willOpen = panel().hidden;
      closeAllPanels();                    // 一次只開一個
      panel().hidden = !willOpen;
      btn().setAttribute("aria-expanded", String(willOpen));
    });
    panel().addEventListener("click", e=>e.stopPropagation());
  }
  function sync(){
    panel().querySelectorAll(".c[data-k]").forEach(el=>{
      const on=sel.has(el.dataset.k),count=el.querySelector(".n")?.textContent||"";
      el.innerHTML=`${esc(labelOf(el.dataset.k))}<span class="n">${esc(count)}</span>`;el.classList.toggle("on",on);el.setAttribute("aria-pressed",String(on));
    });
    const clear=panel().querySelector("[data-clear]");if(clear)clear.textContent=`✕ ${t("clear")}`;
    const label=t(labelKey);btn().textContent = sel.size ? `${label} (${sel.size}) ▾` : `${label} ▾`;
    btn().classList.toggle("active", sel.size>0);
  }
  return {build, sync, sel, labelKey, labelOf, panelId};
}

function closeAllPanels(){
  document.querySelectorAll(".catpanel").forEach(p=>p.hidden=true);
  ["catBtn","srcBtn","kindBtn"].forEach(id=>document.getElementById(id)?.setAttribute("aria-expanded","false"));
}

  const items=[];

    f.sel.forEach(k=>items.push({f,k,text:f.labelOf(k)}));

  if(!items.length){ box.innerHTML=""; return; }
  box.innerHTML = items.map((it,i)=>
      `<button type="button" class="a" data-i="${i}">${esc(it.text)}<span class="x">✕</span></button>`).join("")
    + `<button type="button" class="allclr" data-all="1">${esc(t("clearAll"))}</button>`;
  box.querySelectorAll("[data-i]").forEach(el=>{
    el.onclick=()=>{ const it=items[+el.dataset.i]; it.f.sel.delete(it.k); it.f.sync(); renderActive(); render(); };

function hayRaw(d){
  let s=[d.name,d.kind,KIND_LABEL[d.kind],d.cat,d.desc,d.look,d.suite,d.vendor,(d.tags||[]).join(" "),(d.stack||[]).join(" "),d.desc_en||"",d.desc_ja||"",d.look_en||"",d.look_ja||""];
  if(d.variants){s.push(Object.keys(d.variants).join(" "));s.push(Object.values(d.variants).join(" "));}
  return s.join(" ");
}
function hay(d){return d._search||normalizeText(hayRaw(d));}
function parseTerms(raw){
  const terms=[];
  const pattern=/"([^"]+)"|'([^']+)'|(\S+)/g;
  let match;
  while((match=pattern.exec(raw))) terms.push(normalizeText(match[1]||match[2]||match[3]));
  return [...new Set(terms)];
}
function termGroups(terms){return terms.map(term=>[...new Set([term,...(SEARCH_ALIASES[term]||[]).map(normalizeText)])]);}
function score(d,terms,phrase=""){
  const name=d._nameSearch||normalizeText(d.name), tags=d._tagSearch||normalizeText((d.tags||[]).join(" ")), text=hay(d);
  let sc=0;
  for(const group of termGroups(terms)){
    let best=0;
    for(const t of group){if(!t)continue;best=Math.max(best,(name.includes(t)?5:0)+(tags.includes(t)?3:0)+(text.includes(t)?1:0));}
    sc+=best;
  }
  if(phrase){if(name===phrase)sc+=40;else if(name.includes(phrase))sc+=20;if(tags.includes(phrase))sc+=10;}
  return sc;
}
// 可解釋的人工策展分數，不是下載量、銷量或使用者追蹤資料。
const POPULAR_SRC = ["aescripts","third-party","red-giant","sapphire","universe","continuum","builtin-ae","recipes","installed"];
function popularityBreakdown(d){
  const featured=POPULAR_INDEX.get(`${d._src}:${d.name}`);
  const max=POPULARITY_CONFIG.maximum_points||{};
  const featuredCount=Math.max(1,(POPULARITY_CONFIG.featured||[]).length-1);
  const featuredScore=featured===undefined?0:Math.round((max.featured||56)-(featured/featuredCount)*20);
  const source=Math.min(max.source||20,POPULARITY_CONFIG.source_weights?.[d._src]||0);
  const quality=(d.url?2:0)+(d.look?2:0)+((d.desc||"").length>=30?2:1)+((d.tags||[]).length>=8?2:1)+(d.unverified?0:2);
  const age=d._date?Math.max(0,(Date.now()-Date.parse(d._date+"T00:00:00Z"))/(365.25*86400000)):Infinity;
  const recency=Number.isFinite(age)?Math.max(0,Math.round((max.recency||4)-age)):0;
  const curatedOrder=Math.max(0,(max.curated_order||10)-Math.floor(Math.min(d._rank??500,500)/50));
  return {featured:featuredScore,source,quality,recency,curatedOrder,total:Math.min(100,featuredScore+source+quality+recency+curatedOrder)};
}
function popularityScore(d){return popularityBreakdown(d).total;}
function popularCmp(a,b){
  return popularityScore(b)-popularityScore(a)
    || POPULAR_SRC.indexOf(a._src)-POPULAR_SRC.indexOf(b._src)
    || (a._rank??9999)-(b._rank??9999)
    || (a.name||"").localeCompare(b.name||"");
}
function sourceCmp(a,b){
  return POPULAR_SRC.indexOf(a._src)-POPULAR_SRC.indexOf(b._src)
    || (a._rank??9999)-(b._rank??9999)
    || (a.name||"").localeCompare(b.name||"");
}
function categoryCmp(a,b){
  return (CAT_LABEL[a.cat]||a.cat||"").localeCompare(CAT_LABEL[b.cat]||b.cat||"", localeData().locale)
    || (a.name||"").localeCompare(b.name||"");
}
function resultCmp(a,b,hasTerms){
  const mode=document.getElementById("sort").value;
  if(mode==="name") return (a[1].name||"").localeCompare(b[1].name||"");
  if(mode==="category") return categoryCmp(a[1],b[1]);
  if(mode==="source") return sourceCmp(a[1],b[1]);
  if(mode==="latest") return (b[1]._date||"").localeCompare(a[1]._date||"")||popularCmp(a[1],b[1]);
  if(mode==="relevance" && hasTerms) return b[0]-a[0]||popularCmp(a[1],b[1]);
  return popularCmp(a[1],b[1]);
}
function sortedResults(pool,terms,{requireAll=true,phrase=""}={}){
  const hasTerms=terms.length>0;
  return pool.map(d=>[hasTerms?score(d,terms,phrase):0,d])
    .filter(x=>!hasTerms||(requireAll?termGroups(terms).every(group=>group.some(t=>hay(x[1]).includes(t))):x[0]>0))
    .sort((a,b)=>resultCmp(a,b,hasTerms)).map(x=>x[1]);
}
function hl(txt,terms){
  let s=esc(txt);
  for(const t of terms){if(t.length<1)continue;
    try{s=s.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");}catch(e){}}
  return s;
}

// 中文長詞拆成 2 字詞組（「煙霧模擬」→ 煙霧/霧模/模擬），只在完全搜不到時當備援
const CJK=/[一-鿿㐀-䶿]/;
const CJK2=/^[一-鿿㐀-䶿]{2}$/;   // 兩個字都要是中文，避免產生「z不」這種混雜詞
function segment(terms){
  const out=[];
  for(const t of terms){
    if(t.length>=3 && CJK.test(t)){
      for(let i=0;i<t.length-1;i++){
        const g=t.slice(i,i+2);
        if(CJK2.test(g)) out.push(g);
      }
    }
  }
  return [...new Set(out)];
}

function levenshtein(a,b){
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const row=[i];
    for(let j=1;j<=b.length;j++) row[j]=Math.min(row[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=row;
  }
  return prev[b.length];
}
function vocabulary(){
  if(SEARCH_VOCAB)return SEARCH_VOCAB;
  SEARCH_VOCAB=new Set();
  DATA.forEach(d=>[d.name,...(d.tags||[])].forEach(value=>normalizeText(value).split(/[^a-z0-9\u3400-\u9fff]+/).filter(w=>w.length>=3).forEach(w=>SEARCH_VOCAB.add(w))));
  return SEARCH_VOCAB;
}
function correctTerms(terms){
  const words=vocabulary(), corrected=[];let changed=false;
  for(const term of terms){
    if(term.length<4||words.has(term)||CJK.test(term)){corrected.push(term);continue;}
    const limit=term.length>=7?2:1;
    let best=term,bestDistance=limit+1;
    for(const word of words){if(Math.abs(word.length-term.length)>limit)continue;const distance=levenshtein(term,word);if(distance<bestDistance){best=word;bestDistance=distance;if(!distance)break;}}
    corrected.push(best);changed=changed||best!==term;
  }
  return changed?corrected:[];
}

    list=sortedResults(pool,terms,{requireAll:true,phrase});

        list=sortedResults(pool,terms,{requireAll:false,phrase});

  ta.value = localeData().aiPrompt;
  ta.rows = 6;
  ta.style.cssText = "width:100%;margin-top:8px;padding:10px;border-radius:10px;font-size:12px;"
    + "border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:inherit";
  msg.appendChild(ta);
  ta.focus(); ta.select();
}

document.getElementById("aiBtn").addEventListener("click", async ()=>{
  const msg = document.getElementById("aiMsg");
  msg.innerHTML = "";
  let copied = false;
  try{
    await navigator.clipboard.writeText(localeData().aiPrompt);
    copied = true;
  }catch(e){ copied = false; }
  if(copied){
    msg.innerHTML = `${esc(t("aiCopied"))} <a href="https://github.com/xup61069/ae-effects-db/blob/main/PROMPT.md" target="_blank" rel="noopener">${esc(t("moreUsage"))}</a>`;
    setTimeout(()=>{ if(!msg.querySelector("textarea")) msg.textContent=""; }, 12000);
  }else{
    showPromptBox(msg);
  }
});

let searchTimer;
function scheduleSearch(value){
  document.getElementById("q").value=value;document.getElementById("mq").value=value;
  clearTimeout(searchTimer);searchTimer=setTimeout(()=>render(),70);
}
document.getElementById("q").addEventListener("input",e=>scheduleSearch(e.target.value));
document.getElementById("mq").addEventListener("input",e=>scheduleSearch(e.target.value));
document.getElementById("clearQ").addEventListener("click",()=>{
  scheduleSearch("");document.getElementById("q").focus();
});
document.getElementById("clearMq").addEventListener("click",()=>{scheduleSearch("");document.getElementById("mq").focus();});
document.getElementById("sort").addEventListener("change",()=>render());
document.getElementById("favBtn").addEventListener("click",()=>{
  favoritesOnly=!favoritesOnly;syncFavoriteButton();render();
});
document.getElementById("favManageBtn").addEventListener("click",()=>showDialog("favoritesDialog"));
document.getElementById("favExport").addEventListener("click",favoriteExport);
document.getElementById("favImport").addEventListener("click",()=>document.getElementById("favImportFile").click());
document.getElementById("favImportFile").addEventListener("change",e=>{if(e.target.files[0])favoriteImport(e.target.files[0]);e.target.value="";});
document.getElementById("favClearAll").addEventListener("click",()=>{
  if(!FAVORITES.size)return;
  if(confirm(t("clearConfirm",{count:FAVORITES.size}))){FAVORITES.clear();saveFavorites();favoritesOnly=false;syncFavoriteButton();render();document.getElementById("favManageMsg").textContent=t("cleared");}
});
document.getElementById("languageSwitch").addEventListener("click",event=>{
  const button=event.target.closest("[data-lang]");if(!button||button.dataset.lang===LANG)return;
  LANG=button.dataset.lang;document.getElementById("aiMsg").textContent="";applyLanguage();render();
  const detail=document.getElementById("detailDialog");if(detail.open){const key=new URL(location.href).searchParams.get("item");if(key)openDetail(key,false);}
  if(document.getElementById("compareDialog").open)openCompare();
});
document.getElementById("compareOpen").addEventListener("click",openCompare);
document.getElementById("compareClear").addEventListener("click",()=>{COMPARE.clear();syncCompareTray();render(true);});
document.getElementById("backTop").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
window.addEventListener("scroll",()=>{document.getElementById("backTop").hidden=scrollY<700;},{passive:true});
document.getElementById("detailDialog").addEventListener("close",()=>{const url=new URL(location.href);url.searchParams.delete("item");history.replaceState(null,"",url);});
// 點面板以外的地方、或按 Esc，就收起篩選面板
document.addEventListener("click", closeAllPanels);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeAllPanels(); });
document.addEventListener("click",e=>{
  const close=e.target.closest&&e.target.closest("[data-close]");
  if(close){closeDialog(close.dataset.close);return;}
  const detail=e.target.closest&&e.target.closest("[data-detail]");
  if(detail){openDetail(detail.dataset.detail);return;}
  const compare=e.target.closest&&e.target.closest("[data-compare]");
  if(compare){const key=compare.dataset.compare;toggleCompare(key);if(document.getElementById("detailDialog").open)openDetail(key,false);return;}
  const favorite=e.target.closest&&e.target.closest("[data-favorite]");
  if(favorite){
    const key=favorite.dataset.favorite;
    FAVORITES.has(key)?FAVORITES.delete(key):FAVORITES.add(key);
    saveFavorites();render(true);if(document.getElementById("detailDialog").open)openDetail(key,false);return;
  }
  const share=e.target.closest&&e.target.closest("[data-share-detail]");
  if(share){const url=new URL(location.href);url.searchParams.set("item",share.dataset.shareDetail);navigator.clipboard?.writeText(String(url)).then(()=>{share.textContent=t("copied");}).catch(()=>prompt(t("copyUrl"),url));return;}
  const q=e.target.getAttribute&&e.target.getAttribute("data-q");
  if(q){scheduleSearch(q);window.scrollTo({top:0,behavior:"smooth"});}
});
boot();
</script>
</body>
</html>
