name: validate

on:
  push:
    branches: [main]
    paths: ["*.md", "llms.txt", "ae-effects-db/**", ".github/**", "assets/**", "data/**", "dist/**", "curation/**", "skill/**", "index.html", "i18n.js", "manifest.webmanifest", "service-worker.js", "package*.json", "playwright.config.js", "tests/**", "validate.py", "search.py", "search_core.py", "tools/**", "schema/**"]
  pull_request:
    paths: ["*.md", "llms.txt", "ae-effects-db/**", ".github/**", "assets/**", "data/**", "dist/**", "curation/**", "skill/**", "index.html", "i18n.js", "manifest.webmanifest", "service-worker.js", "package*.json", "playwright.config.js", "tests/**", "validate.py", "search.py", "search_core.py", "tools/**", "schema/**"]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Reject nested ae-effects-db copy
        run: |
          if git ls-files ae-effects-db/ | grep -q .; then
            echo "::error::nested ae-effects-db/ copy must not be tracked"
            exit 1
          fi
          if [ -d ae-effects-db ]; then
            echo "::error::nested ae-effects-db/ directory must not exist"
            exit 1
          fi
      - name: Validate data/*.jsonl
        run: python validate.py --strict
      - name: Audit curated keys and duplicate products
        run: python tools/audit.py --strict
      - name: Run search and consistency tests
        run: python -m unittest discover -s tests -v
      - name: Validate web JavaScript and locales
        run: node --check tools/build_localization.js && npm run test:web
      - name: Verify generated indexes are current
        run: python tools/build_index.py && git diff --exit-code -- dist/
      - name: Compile Python tools
        run: python -m py_compile validate.py search.py search_core.py tools/add.py tools/assign_ids.py tools/audit.py tools/build_index.py tools/classify_kind.py tools/find_new.py tools/scan_booth.py tools/scan_gumroad.py tests/test_consistency.py tests/test_docs.py tests/test_localization.py tests/test_repo_hygiene.py tests/test_vnext.py tests/test_web_ui.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Chromium, accessibility, mobile, and PWA tests
        run: npm run test:e2e
