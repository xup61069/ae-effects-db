name: 補充特效 / 回報問題
description: 想到什麼就寫什麼，格式不拘，我們會整理進資料庫
title: "補充："
labels: ["add-effect"]
body:
  - type: markdown
    attributes:
      value: |
        隨便寫沒關係 👌 貼個外掛名稱、官網連結，或只說「我想找XX效果但搜不到」都可以。
        剩下的整理工作交給我們（和 AI）就好。
  - type: textarea
    id: body
    attributes:
      label: 內容
      placeholder: |
        例如：
        · Deep Glow 這個外掛沒收錄
        · https://aescripts.com/xxxx/
        · 想找「文字爆炸成粒子」但搜不到
        · 某某條目的說明怪怪的
  - type: input
    id: official-url
    attributes:
      label: 原廠網址（選填）
      description: 有原廠產品或文件頁最好；沒有也可以留空，請勿貼下載站。
      placeholder: https://vendor.example/product/
  - type: input
    id: search-terms
    attributes:
      label: 你原本搜尋的字（選填）
      description: 若是搜尋不到，這能幫助我們補中文俗名、英文同義詞與用途標籤。
      placeholder: 例如：液態金屬、甩鏡、去霧
